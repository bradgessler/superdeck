{{template "head" .}}
<a class="backlink" href="/accounts/{{.ID}}">‹ {{.Name}}</a>
<h1>Rename account</h1>
<p class="lede">This only changes the name shown here. The Claude login stays as it is.</p>
<form method="post" action="/accounts/{{.ID}}/rename" class="stack">
  <label for="name">Name</label>
  <input id="name" name="name" value="{{.Name}}" pattern="[a-z0-9][a-z0-9\-]{0,31}" required autofocus autocapitalize="none" autocorrect="off" spellcheck="false">
  <p class="small">Lowercase letters, digits and dashes.</p>
  <button class="btn primary big">Save name</button>
</form>
{{template "foot" .}}
