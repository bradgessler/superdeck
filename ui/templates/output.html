{{template "head" .}}
<a class="backlink" href="/instances/{{.I.ID}}">‹ {{.I.Title}}</a>
<h1>Terminal</h1>
<p class="meta">{{if .I.Live}}Live. This is what Claude is showing right now.{{else}}This is what Claude showed before it exited.{{end}}</p>
<pre class="screen"{{if .I.Live}} hx-get="/instances/{{.I.ID}}/screen" hx-trigger="every 1s"{{end}}>{{.Screen}}</pre>
{{if .I.Live}}
<form method="post" action="/instances/{{.I.ID}}/key" hx-post="/instances/{{.I.ID}}/key" hx-swap="none" class="keys" aria-label="Press a key">
  <button name="key" value="enter" class="wide">Enter</button>
  <button name="key" value="y">y</button>
  <button name="key" value="n">n</button>
  <button name="key" value="1">1</button>
  <button name="key" value="2">2</button>
  <button name="key" value="3">3</button>
  <button name="key" value="up" aria-label="Up">↑</button>
  <button name="key" value="down" aria-label="Down">↓</button>
  <button name="key" value="esc">Esc</button>
</form>
<p class="small">These are the only keys this page can press.</p>
{{end}}
{{template "foot" .}}
