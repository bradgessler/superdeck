{{template "head" .}}
<h1>Accounts</h1>
<div class="rows">
  {{range .Accounts}}
  <a href="/accounts/{{.ID}}">
    <span class="led{{if .Pending}} wait{{else if .SignedIn}} on{{end}}"></span>
    <span class="row-body">
      <span class="row-title">{{.Name}}</span>
      <span class="row-sub">{{.Who}}{{if .Same}} · same login as {{.Same}}{{end}}</span>
    </span>
  </a>
  {{else}}
  <div class="empty"><b>No accounts yet.</b>Add one for each Claude login you want to run instances under.</div>
  {{end}}
</div>
<div class="actions">
  <a class="btn big primary" href="/accounts/new">Add account</a>
</div>
{{template "foot" .}}
