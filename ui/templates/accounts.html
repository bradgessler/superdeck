{{template "head" .}}
<div class="head">
  <h1>Accounts</h1>
  <a class="btn primary" href="/accounts/new">Add account</a>
</div>
<div class="rows">
  {{range .Accounts}}
  <div>
    <span class="led{{if .Pending}} wait{{else if .SignedIn}} on{{end}}"></span>
    <span class="row-body">
      <span class="row-title">{{.Name}}</span>
      <span class="row-sub">{{.Who}}</span>
    </span>
    <a class="btn quiet" href="/accounts/{{.ID}}/rename">Rename</a>
    {{if .Pending}}<a class="btn" href="/instances/{{.Pending}}">Continue</a>
    {{else}}<form method="post" action="/accounts/{{.ID}}/signin"><button class="btn{{if .SignedIn}} quiet{{end}}">{{if .SignedIn}}Sign in again{{else}}Sign in{{end}}</button></form>{{end}}
  </div>
  {{else}}
  <div class="empty"><b>No accounts yet.</b>Add one for each Claude login you want to run instances under.</div>
  {{end}}
</div>
{{template "foot" .}}
