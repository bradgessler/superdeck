{{template "head" .}}
<h1>Instances</h1>
{{template "instance-list" .}}
<div class="actions">
  <a class="btn big primary" href="/new">New instance</a>
</div>
<form method="post" action="/update" class="foot">
  {{if .Claude}}<span>Claude Code {{.Claude}}</span>{{end}}
  {{if .Updating}}<a href="/instances/{{.Updating}}">Checking for updates…</a>
  {{else}}<button>Check for updates</button>{{end}}
</form>
{{template "foot" .}}
