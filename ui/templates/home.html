{{template "head" .}}
<div class="head">
  <h1>Instances</h1>
  <a class="btn primary" href="/new">New instance</a>
</div>
{{template "instance-list" .}}
<div class="foot">
  {{if .Claude}}<span>Claude Code {{.Claude}}</span>{{end}}
  {{if .Updating}}<a class="link" href="/instances/{{.Updating}}">Update in progress</a>
  {{else}}<form method="post" action="/update"><button class="link">Check for updates</button></form>{{end}}
</div>
{{template "foot" .}}
