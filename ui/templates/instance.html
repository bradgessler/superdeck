{{template "head" .}}
<a class="backlink" href="/">‹ Instances</a>
{{template "instance-live" .}}

<div class="actions">
  {{if .I.Live}}
  <form method="post" action="/instances/{{.I.ID}}/stop" hx-post="/instances/{{.I.ID}}/stop"{{if .I.IsServer}} hx-confirm="Stop this instance? Any Claude sessions it is hosting will end."{{end}}>
    <button class="btn big stop">{{if .I.IsServer}}Stop instance{{else}}Cancel{{end}}</button>
  </form>
  {{else if .I.IsServer}}
  <form method="post" action="/instances/{{.I.ID}}/relaunch"><button class="btn big primary">Launch again</button></form>
  {{end}}
  <a class="btn big" href="/instances/{{.I.ID}}/output">Terminal</a>
</div>
{{template "foot" .}}
