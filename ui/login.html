<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superdeck sign in</title>
<style>
  body { font: 16px -apple-system, system-ui, sans-serif; background: #111418; color: #e6e8eb; margin: 0; padding: 48px 16px; }
  form { max-width: 360px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  p { color: #9aa3ad; margin: 0; font-size: 14px; }
  input, button { font: inherit; padding: 12px; border-radius: 8px; border: 1px solid #2c333b; background: #1a1f25; color: inherit; }
  button { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Superdeck</h1>
  <p>Paste the access token from <code>~/.superdeck/token</code> on the Mac.</p>
  <input name="token" type="password" autocomplete="current-password" required autofocus>
  <button>Sign in</button>
</form>
</body>
</html>
